spring:
  application:
    name: epibrother-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/epibrother}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  seed:
    admin-password: ${DEFAULT_ADMIN_PASSWORD:}
    manager-password: ${DEFAULT_MANAGER_PASSWORD:}
    alice-password: ${DEFAULT_ALICE_PASSWORD:}
    bob-password: ${DEFAULT_BOB_PASSWORD:}

server:
  port: 8080

logging:
  level:
    com.episecurity.epibrother: INFO
