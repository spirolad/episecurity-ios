services:
  ollama:
    image: ollama/ollama:0.6.8
    container_name: epibrother-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama-model:
    image: ollama/ollama:0.6.8
    container_name: epibrother-ollama-model
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    command: ["pull", "${OLLAMA_MODEL:-qwen2.5:3b}"]

  postgres:
    image: postgres:16-alpine
    container_name: epibrother-postgres
    restart: unless-stopped
    env_file:
      - path: .env.docker
        required: false
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-epibrother}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-epibrother}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: epibrother-backend
    restart: unless-stopped
    env_file:
      - path: .env.docker
        required: false
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      ollama-model:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/epibrother}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD}
      DEFAULT_MANAGER_PASSWORD: ${DEFAULT_MANAGER_PASSWORD}
      DEFAULT_ALICE_PASSWORD: ${DEFAULT_ALICE_PASSWORD}
      DEFAULT_BOB_PASSWORD: ${DEFAULT_BOB_PASSWORD}
      APP_AI_OLLAMA_BASE_URL: http://ollama:11434
      APP_AI_OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}

volumes:
  postgres_data:
  ollama_data:
